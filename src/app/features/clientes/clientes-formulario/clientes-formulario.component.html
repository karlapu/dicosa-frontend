<div class="contenedor">
  <a class="volver" routerLink="/clientes">← Volver al listado</a>

  <h2>{{ modoEdicion ? 'Editar' : 'Nuevo' }} Cliente</h2>

  <p *ngIf="error" class="error">{{ error }}</p>

  <form (ngSubmit)="guardar()">

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="cliente.nombre"
        required
        placeholder="Ingresa el nombre del cliente" />
    </div>

    <div class="campo">
      <label for="nit">NIT</label>
      <input
        type="text"
        id="nit"
        name="nit"
        [(ngModel)]="cliente.nit"
        placeholder="Ingresa el NIT" />
    </div>

    <div class="campo">
      <label for="telefono">Teléfono</label>
      <input
        type="text"
        id="telefono"
        name="telefono"
        [(ngModel)]="cliente.telefono"
        placeholder="Ingresa el teléfono" />
    </div>

    <div class="campo">
      <label for="correo">Correo</label>
      <input
        type="email"
        id="correo"
        name="correo"
        [(ngModel)]="cliente.correo"
        placeholder="Ingresa el correo" />
    </div>

    <div class="campo">
      <label for="municipio">Municipio</label>
      <select
        id="municipio"
        name="idMunicipio"
        [(ngModel)]="cliente.idMunicipio"
        required>

        <option [ngValue]="0" disabled>
          Selecciona un municipio
        </option>

        <option
          *ngFor="let municipio of municipios"
          [ngValue]="municipio.idMunicipio">
          {{ municipio.nombre }}
        </option>
      </select>
    </div>

    <div class="campo">
      <label for="direccion">Dirección</label>
      <textarea
        id="direccion"
        name="direccion"
        [(ngModel)]="cliente.direccion"
        placeholder="Ingresa la dirección"></textarea>
    </div>

    <div class="acciones">
      <button type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
