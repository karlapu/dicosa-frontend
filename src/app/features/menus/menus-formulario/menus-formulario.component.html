<div class="contenedor">
  <a class="volver" (click)="cancelar()">&larr; Volver al listado</a>

  <h2>{{ modoEdicion ? 'Editar menú' : 'Nuevo menú' }}</h2>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form (ngSubmit)="guardar()">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="menu.nombre" required>
    </div>

    <div class="campo">
      <label for="ruta">Ruta</label>
      <input type="text" id="ruta" name="ruta" [(ngModel)]="menu.ruta">
    </div>

    <div class="campo">
      <label for="idModulo">Módulo</label>
      <select id="idModulo" name="idModulo" [(ngModel)]="menu.idModulo" required>
        <option [ngValue]="null" disabled>Selecciona un módulo</option>
        <option *ngFor="let modulo of modulos" [ngValue]="modulo.idModulo">{{ modulo.nombre }}</option>
      </select>
    </div>

    <div class="acciones">
      <button type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
