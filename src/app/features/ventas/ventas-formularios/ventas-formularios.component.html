<div class="contenedor">
  <h2>Nueva Venta</h2>

  <p *ngIf="error" class="mensaje-error">{{ error }}</p>

  <form #formRef="ngForm" (ngSubmit)="guardar()">

    <div class="fila-cabecera">
      <div class="campo">
        <label for="idCliente">Cliente *</label>
        <select
          id="idCliente"
          name="idCliente"
          [(ngModel)]="venta.idCliente"
          required
          #clienteRef="ngModel"
          class="input"
          [class.input-invalido]="clienteRef.invalid && clienteRef.touched"
        >
          <option [ngValue]="null" disabled>Seleccione un cliente</option>
          <option *ngFor="let c of clientes" [ngValue]="c.idCliente">{{ c.nombre }}</option>
        </select>
        <p *ngIf="clienteRef.invalid && clienteRef.touched" class="mensaje-advertencia">
          Debe seleccionar un cliente.
        </p>
      </div>

      <div class="campo">
        <label for="idSucursal">Sucursal que vende *</label>
        <select
          id="idSucursal"
          name="idSucursal"
          [(ngModel)]="venta.idSucursal"
          required
          #sucursalRef="ngModel"
          class="input"
          [class.input-invalido]="sucursalRef.invalid && sucursalRef.touched"
        >
          <option [ngValue]="null" disabled>Seleccione una sucursal</option>
          <option *ngFor="let s of sucursales" [ngValue]="s.idSucursal">{{ s.nombre }}</option>
        </select>
        <p *ngIf="sucursalRef.invalid && sucursalRef.touched" class="mensaje-advertencia">
          Debe seleccionar la sucursal que despacha la mercadería.
        </p>
      </div>

      <div class="campo">
        <label for="descuento">Descuento</label>
        <input
          type="number"
          id="descuento"
          name="descuento"
          [(ngModel)]="venta.descuento"
          min="0"
          step="0.01"
          class="input input-numero"
        />
      </div>
    </div>

    <h3>Productos</h3>

    <table class="tabla-lineas">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio unitario</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let detalle of venta.detalles; let i = index">
          <td>
            <select
              [name]="'producto' + i"
              [(ngModel)]="detalle.idProducto"
              (change)="onProductoSeleccionado(detalle)"
              required
              class="input"
            >
              <option [ngValue]="null" disabled>Seleccione un producto</option>
              <option *ngFor="let prod of productos" [ngValue]="prod.idProducto">{{ prod.nombre }}</option>
            </select>
          </td>
          <td>
            <input
              type="number"
              [name]="'cantidad' + i"
              [(ngModel)]="detalle.cantidad"
              required
              min="1"
              class="input input-numero"
            />
          </td>
          <td>
            <input
              type="number"
              [name]="'precio' + i"
              [(ngModel)]="detalle.precioUnitario"
              required
              min="0.01"
              step="0.01"
              class="input input-numero"
            />
          </td>
          <td class="subtotal">Q{{ calcularSubtotalLinea(detalle) | number:'1.2-2'
