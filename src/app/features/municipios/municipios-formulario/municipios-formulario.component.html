<div class="contenedor">
  <a class="volver" (click)="cancelar()">&larr; Volver al listado</a>

  <h2>{{ modoEdicion ? 'Editar municipio' : 'Nuevo municipio' }}</h2>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form (ngSubmit)="guardar()">

    <div class="campo">
      <label for="departamento">Departamento</label>

      <select
        id="departamento"
        name="idDepartamento"
        [(ngModel)]="municipio.idDepartamento"
        required>

        <option [ngValue]="null">
          Seleccionar departamento
        </option>

        <option
          *ngFor="let departamento of departamentos"
          [ngValue]="departamento.idDepartamento">

          {{ departamento.nombre }}

        </option>
      </select>
    </div>

    <div class="campo">
      <label for="nombre">Nombre del municipio</label>

      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="municipio.nombre"
        required>
    </div>

    <div class="acciones">
      <button type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>

      <button type="button" (click)="cancelar()">
        Cancelar
      </button>
    </div>

  </form>
</div>
