<div class="contenedor">
  <a class="volver" routerLink="/productos">← Volver al listado</a>

  <h2>{{ modoEdicion ? 'Editar' : 'Nuevo' }} Producto</h2>

  <p *ngIf="error" class="error">{{ error }}</p>

  <form (ngSubmit)="guardar()">

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="producto.nombre"
        required
        placeholder="Ingresa el nombre del producto" />
    </div>

    <div class="campo">
      <label for="codigoBarra">Código de barra</label>
      <input
        type="text"
        id="codigoBarra"
        name="codigoBarra"
        [(ngModel)]="producto.codigoBarra"
        placeholder="Ingresa el código de barra" />
    </div>

    <div class="campo">
      <label for="categoria">Categoría</label>
      <select
        id="categoria"
        name="idCategoria"
        [(ngModel)]="producto.idCategoria"
        required>

        <option [ngValue]="0" disabled>
          Selecciona una categoría
        </option>

        <option
          *ngFor="let categoria of categorias"
          [ngValue]="categoria.idCategoria">
          {{ categoria.nombre }}
        </option>
      </select>
    </div>

    <div class="campo">
      <label for="precioCosto">Precio de costo</label>
      <input
        type="number"
        id="precioCosto"
        name="precioCosto"
        [(ngModel)]="producto.precioCosto"
        step="0.01"
        min="0"
        required
        placeholder="0.00" />
    </div>

    <div class="campo">
      <label for="precioVenta">Precio de venta</label>
      <input
        type="number"
        id="precioVenta"
        name="precioVenta"
        [(ngModel)]="producto.precioVenta"
        step="0.01"
        min="0"
        required
        placeholder="0.00" />
    </div>

    <div class="campo">
      <label for="stockMinimo">Stock mínimo</label>
      <input
        type="number"
        id="stockMinimo"
        name="stockMinimo"
        [(ngModel)]="producto.stockMinimo"
        min="0"
        placeholder="0" />
    </div>

    <div class="campo">
      <label>Imagen del producto</label>

      <input
        type="file"
        id="imagen"
        name="imagen"
        accept="image/png,image/jpeg,image/webp"
        class="input-archivo"
        #selectorImagen
        (change)="onImagenSeleccionada($event)" />

      <div
        class="zona-imagen"
        [class.arrastrando]="arrastrando"
        [class.con-imagen]="imagenMostrada && !errorImagen"
        (dragover)="onArrastrar($event)"
        (dragleave)="onSalirArrastre($event)"
        (drop)="onSoltar($event)">

        <ng-container *ngIf="imagenMostrada && !errorImagen; else sinImagen">
          <img
            [src]="imagenMostrada"
            alt="Vista previa de la imagen"
            class="vista-previa-imagen"
            (error)="errorImagen = true" />

          <div class="acciones-imagen">
            <button type="button" class="btn-imagen" (click)="selectorImagen.click()" [disabled]="subiendoImagen">Cambiar</button>
            <button type="button" class="btn-imagen btn-quitar" (click)="quitarImagen()" [disabled]="subiendoImagen">Quitar</button>
          </div>
        </ng-container>

        <ng-template #sinImagen>
          <div class="zona-vacia" (click)="selectorImagen.click()">
            <span class="icono-imagen">🖼️</span>
            <span class="texto-principal">{{ errorImagen ? 'No se pudo mostrar la imagen' : 'Haz clic o arrastra una imagen aquí' }}</span>
            <span class="texto-ayuda">JPG, PNG o WEBP · máximo 5 MB</span>
          </div>
        </ng-template>

        <div *ngIf="subiendoImagen" class="subiendo">Subiendo imagen...</div>
      </div>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        name="descripcion"
        [(ngModel)]="producto.descripcion"
        placeholder="Ingresa una descripción"></textarea>
    </div>

    <div class="acciones">
      <button type="submit" [disabled]="guardando || subiendoImagen">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
