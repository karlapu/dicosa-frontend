<div class="pantalla-login">
  <div class="tarjeta-login">
    <h1>Dicosa</h1>
    <p class="subtitulo">Sistema de inventario y ventas</p>

    <div *ngIf="error" class="error">{{ error }}</div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="campo">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" [(ngModel)]="credenciales.username" required autofocus>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" required>
      </div>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
