<div class="contenedor">
  <a class="volver" (click)="cancelar()">&larr; Volver al listado</a>

  <h2>{{ modoEdicion ? 'Editar rol' : 'Nuevo rol' }}</h2>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form (ngSubmit)="guardar()">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="rol.nombre" required>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" [(ngModel)]="rol.descripcion"></textarea>
    </div>

    <div class="acciones">
      <button type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
