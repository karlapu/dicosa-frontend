<div class="contenedor">
  <h2>Roles registrados</h2>

  <button (click)="irANuevo()">+ Nuevo rol</button>

  <div *ngIf="cargando">Cargando roles...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!cargando && !error">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles">
        <td>{{ rol.idRol }}</td>
        <td>{{ rol.nombre }}</td>
        <td>{{ rol.descripcion }}</td>
        <td>{{ rol.estado }}</td>
        <td>
          <button (click)="irAEditar(rol.idRol!)">Editar</button>
          <button *ngIf="rol.estado === 'ACTIVO'" (click)="desactivar(rol.idRol!)">Desactivar</button>
          <button *ngIf="rol.estado === 'INACTIVO'" (click)="activar(rol.idRol!)">Activar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && !error && roles.length === 0">No hay roles registrados todavía.</p>
</div>
