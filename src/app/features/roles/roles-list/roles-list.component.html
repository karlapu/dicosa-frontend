<div class="contenedor">
  <h2>Roles registrados</h2>

  <div *ngIf="cargando">Cargando roles...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!cargando && !error">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles">
        <td>{{ rol.idRol }}</td>
        <td>{{ rol.nombre }}</td>
        <td>{{ rol.descripcion }}</td>
        <td>{{ rol.estado }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && !error && roles.length === 0">No hay roles registrados todavía.</p>
</div>
